input:
  MODEL:
    type: string
    optional: true
    default: "anthropic/claude-opus-4-7"
    description: LLM model to use for this session (provider/model-id format).
  TEMPERATURE:
    type: number
    optional: true
    default: 0.7
    description: "Sampling temperature (0-2). Lower = more focused, higher = more creative."
  THINKING:
    type: string
    optional: true
    default: "off"
    description: "Extended reasoning level. Values: off, low, medium, high, max."
  EXTRA_INSTRUCTIONS:
    type: string
    optional: true
    default: ""
    description: Trusted course-author instructions appended to the system prompt at session creation.
  VERBOSITY_INSTRUCTIONS:
    type: string
    optional: true
    default: "Be clear, concise, and conversational"
    description: "Response verbosity directive injected into the system prompt guidelines."
  LANGUAGE:
    type: string
    optional: true
    default: "English"
    description: "The language the agent should speak in when responding."
  MODE:
    type: string
    optional: true
    default: "assistant"
    description: "Session role: 'assistant' (Cosmo the copilot) or 'recipient' (in-character correspondent)."
  PERSONA:
    type: string
    optional: true
    default: ""
    description: "For recipient sessions: the character description the agent must role-play."
  PERSONA_NAME:
    type: string
    optional: true
    default: ""
    description: "For recipient sessions: the display name the agent signs replies as."

triggers:
  assistant-message:
    input:
      USER_MESSAGE:
        type: string
      CUSTOM_INSTRUCTIONS:
        type: string
        optional: true
        description: User-provided custom instructions. Delivered in the user turn (NOT the system prompt) so they remain subordinate to the system guardrails.
      THREAD_CONTEXT:
        type: string
        optional: true
        description: Serialized inbox/thread the learner is working in (Markdown), refreshed each turn so Cosmo can answer, summarize, and extract.
      CURRENT_DRAFT:
        type: string
        optional: true
        description: The learner's current compose draft (Markdown), refreshed each turn so Cosmo can help revise it.
      FILES:
        type: file[]
        optional: true

  recipient-reply:
    input:
      LEARNER_EMAIL:
        type: string
        description: The email the learner just sent, which the recipient is replying to (Markdown).
      THREAD_CONTEXT:
        type: string
        optional: true
        description: The full thread so far (Markdown) for continuity.

agent:
  model: MODEL
  system: system
  input:
    EXTRA_INSTRUCTIONS: EXTRA_INSTRUCTIONS
    VERBOSITY_INSTRUCTIONS: VERBOSITY_INSTRUCTIONS
    LANGUAGE: LANGUAGE
    MODE: MODE
    PERSONA: PERSONA
    PERSONA_NAME: PERSONA_NAME
  temperature: TEMPERATURE
  thinking: THINKING
  webSearch: true
  agentic: true

handlers:
  assistant-message:
    Add user message:
      block: add-message
      role: user
      prompt: assistant-message
      input: [USER_MESSAGE, CUSTOM_INSTRUCTIONS, THREAD_CONTEXT, CURRENT_DRAFT, FILES]
      files: [FILES]
      uiContent: USER_MESSAGE
      display: hidden

    Respond:
      block: next-message

  recipient-reply:
    Add learner email:
      block: add-message
      role: user
      prompt: recipient-reply
      input: [LEARNER_EMAIL, THREAD_CONTEXT]
      uiContent: LEARNER_EMAIL
      display: hidden

    Respond:
      block: next-message
