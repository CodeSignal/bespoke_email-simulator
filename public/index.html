<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mail</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Design System: Foundations -->
  <link rel="stylesheet" href="/design-system/colors/colors.css" />
  <link rel="stylesheet" href="/design-system/spacing/spacing.css" />
  <link rel="stylesheet" href="/design-system/typography/typography.css" />

  <!-- Design System: Components -->
  <link rel="stylesheet" href="/design-system/components/button/button.css" />
  <link rel="stylesheet" href="/design-system/components/boxes/boxes.css" />
  <link rel="stylesheet" href="/design-system/components/icons/icons.css" />
  <link rel="stylesheet" href="/design-system/components/input/input.css" />
  <link rel="stylesheet" href="/design-system/components/tags/tags.css" />
  <link rel="stylesheet" href="/design-system/components/dropdown/dropdown.css" />
  <link rel="stylesheet" href="/design-system/components/modal/modal.css" />
  <link rel="stylesheet" href="/design-system/components/split-panel/split-panel.css" />

  <!-- Figma tokens not (yet) in the design system -->
  <link rel="stylesheet" href="/global.css" />

  <link rel="stylesheet" href="/app.css" />
</head>
<body>

  <div class="boot-error body-small" id="bootError" role="alert" hidden></div>

  <div class="mail-app" id="mailApp">
    <div class="shell-backdrop" id="shellBackdrop" hidden></div>

    <!-- ── MAILBOX RAIL (folders only) ── -->
    <aside class="rail" id="threadRail" aria-label="Mailbox">
      <div class="rail__header">
        <img class="rail__logo" src="/icons/mail-logo.svg" width="22" height="22" alt="" />
        <span class="rail__title" id="appTitle">Mail</span>
        <button type="button" class="icon-button icon-button--ghost rail__drawer-close" id="railDrawerCloseBtn" hidden aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6L18 18"/>
          </svg>
        </button>
        <button type="button" class="icon-button icon-button--primary" id="composeBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20H21M3.00003 20H4.67457C5.16375 20 5.40834 20 5.63852 19.9447C5.84259 19.8957 6.03768 19.8149 6.21662 19.7053C6.41846 19.5816 6.59141 19.4086 6.93731 19.0627L19.5001 6.49999C20.3285 5.67156 20.3285 4.32842 19.5001 3.49999C18.6716 2.67156 17.3285 2.67156 16.5001 3.49999L3.93729 16.0627C3.59138 16.4086 3.41843 16.5816 3.29475 16.7834C3.18509 16.9624 3.10428 17.1575 3.05529 17.3615C3.00003 17.5917 3.00003 17.8363 3.00003 18.3255V20Z"/>
          </svg>
          <span class="visually-hidden" id="composeBtnLabel">Compose</span>
        </button>
      </div>
      <nav class="rail__mailboxes" id="mailboxList" aria-label="Folders"></nav>
    </aside>

    <!-- ── MAIN + COSMO: resizable SplitPanel (rail stays fixed) ── -->
    <div class="mail-split" id="mailSplit">

    <!-- ── MAIN: list or conversation; new mail floats as a PiP overlay ── -->
    <main class="mail-main" id="mailMain">
      <header class="mail-toolbar" id="mailToolbar">
        <button type="button" class="icon-button mail-toolbar__drawer" id="railDrawerBtn" hidden aria-expanded="false" aria-controls="threadRail">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6H20M4 12H20M4 18H20"/>
          </svg>
          <span class="visually-hidden" id="railDrawerBtnLabel">Folders</span>
        </button>
        <button type="button" class="icon-button mail-toolbar__drawer" id="assistantDrawerBtn" hidden aria-expanded="false" aria-controls="assistantPanel">
          <img src="/icons/ai-sparkles.svg" width="14" height="14" alt="" />
          <span class="visually-hidden" id="assistantDrawerBtnLabel">AI Assistant</span>
        </button>
        <button type="button" class="mail-back" id="backBtn" hidden>
          <span class="icon-button" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 5L5 12L12 19"/>
            </svg>
          </span>
          <span class="mail-back__label" id="backBtnLabel">Back to inbox</span>
        </button>
        <h1 class="mail-toolbar__title" id="mailToolbarTitle" tabindex="-1">
          <span class="mail-toolbar__name" id="mailToolbarName">Inbox</span>
          <span class="mail-toolbar__count" id="mailToolbarCount"></span>
        </h1>
        <!-- Figma toolbar (470:11440): design-system primary xsmall button -->
        <button type="button" class="button button-primary button-xsmall mail-toolbar__compose" id="toolbarComposeBtn">
          <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 15H15.75M2.25002 15H3.50593C3.87281 15 4.05626 15 4.22889 14.9585C4.38194 14.9218 4.52826 14.8612 4.66247 14.779C4.81384 14.6862 4.94356 14.5565 5.20298 14.297L14.625 4.87499C15.2464 4.25367 15.2464 3.24631 14.625 2.62499C14.0037 2.00367 12.9964 2.00367 12.375 2.62499L2.95296 12.047C2.69354 12.3065 2.56382 12.4362 2.47106 12.5876C2.38882 12.7218 2.32821 12.8681 2.29146 13.0211C2.25002 13.1938 2.25002 13.3772 2.25002 13.7441V15Z"/>
          </svg>
          <span id="toolbarComposeLabel">Compose</span>
        </button>
      </header>

      <section class="mail-list" id="mailList" aria-label="Mail">
        <div class="mail-list__rows" id="threadList"></div>
      </section>

      <div class="visually-hidden" id="mailViewStatus" role="status"></div>
      <section class="reading-pane" id="readingPane" aria-label="Conversation" hidden></section>

      <!-- A <div>, not a <section>: when expanded, this is appended into the design-system
           Modal's .modal-content, whose CSS styles "section h2/h3/p/ol/ul" descendants as
           long-form rich-text content. Being a <section> pulled in that unrelated styling
           (e.g. a large margin/padding/border under the composer title). role="group" keeps
           the same accessible semantics a <section aria-label> would have had. -->
      <div class="composer" id="composer" role="group" aria-label="Compose" hidden>
        <!-- Figma "Replying" (470:12849): one panel for new messages and replies. -->
        <header class="composer__head" id="composerChrome">
          <span class="composer__head-icon" id="composerIcon" aria-hidden="true"></span>
          <h2 class="composer__title" id="composerTitle">New message</h2>
          <!-- untitled-ui x-close -->
          <button type="button" class="icon-button icon-button--ghost composer__close" id="composerCloseBtn" aria-label="Close" title="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6L6 18M6 6L18 18"/>
            </svg>
          </button>
        </header>
        <div class="composer__panel" id="composerPanel">
          <div class="composer__fields">
            <div class="composer__field composer__field--recipients">
              <span class="composer__label" id="composeToLabel">To</span>
              <div class="recipient-picker dropdown-container" id="composeToPicker" data-field="to">
                <div class="recipient-picker__chips" id="composeToChips"></div>
                <input type="text" class="recipient-picker__input" id="composeToInput" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="composeToMenu" autocomplete="off" spellcheck="false" />
                <ul class="dropdown-menu dropdown-menu-list recipient-picker__menu" id="composeToMenu" role="listbox" aria-labelledby="composeToLabel" hidden></ul>
              </div>
            </div>
            <div class="composer__field composer__field--recipients">
              <span class="composer__label" id="composeCcLabel">Cc</span>
              <div class="recipient-picker dropdown-container" id="composeCcPicker" data-field="cc">
                <div class="recipient-picker__chips" id="composeCcChips"></div>
                <input type="text" class="recipient-picker__input" id="composeCcInput" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="composeCcMenu" autocomplete="off" spellcheck="false" />
                <ul class="dropdown-menu dropdown-menu-list recipient-picker__menu" id="composeCcMenu" role="listbox" aria-labelledby="composeCcLabel" hidden></ul>
              </div>
            </div>
            <div class="composer__field composer__field--subject">
              <label class="composer__label" id="composeSubjectLabel" for="composeSubject">Subject</label>
              <input type="text" class="composer__input" id="composeSubject" autocomplete="off" />
            </div>
          </div>
          <div class="composer__body" id="composerBody">
            <!-- TipTap editor mounts here (Stage 4) -->
            <div class="composer__placeholder" id="composerPlaceholder">Write your message...</div>
          </div>
          <div class="composer__attachments" id="attachmentPreview" hidden></div>
          <input type="file" id="fileInput" multiple hidden />
          <div class="composer__toolbar">
            <button type="button" class="button button-primary composer__send" id="sendBtn" disabled>Send</button>
            <button type="button" class="composer__text-btn" id="discardBtn" hidden>Cancel</button>
            <button type="button" class="composer__text-btn composer__attach" id="attachBtn" hidden>Attach</button>
          </div>
        </div>
      </div>
      <div class="mail-toasts" id="mailToasts" aria-live="polite" aria-relevant="additions"></div>
    </main>

    <!-- ── ASSISTANT PANEL ── -->
    <aside class="assistant" id="assistantPanel" aria-label="AI Assistant">
      <div class="assistant__card">
        <div class="assistant__header">
          <img class="assistant__logo" src="/icons/ai-sparkles.svg" width="9" height="9" alt="" />
          <h2 class="assistant__title">AI Assistant</h2>
          <button type="button" class="icon-button icon-button--ghost assistant__drawer-close" id="assistantDrawerCloseBtn" hidden aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6L6 18M6 6L18 18"/>
            </svg>
          </button>
          <button type="button" class="icon-button icon-button--outline assistant__clear" id="assistantClearBtn" aria-label="New conversation" title="New conversation" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 13.5V7.5M9 10.5H15M7 18V20.3355C7 20.8684 7 21.1348 7.10923 21.2716C7.20422 21.3906 7.34827 21.4599 7.50054 21.4597C7.67563 21.4595 7.88367 21.2931 8.29976 20.9602L10.6852 19.0518C11.1725 18.662 11.4162 18.4671 11.6875 18.3285C11.9282 18.2055 12.1844 18.1156 12.4492 18.0613C12.7477 18 13.0597 18 13.6837 18H16.2C17.8802 18 18.7202 18 19.362 17.673C19.9265 17.3854 20.3854 16.9265 20.673 16.362C21 15.7202 21 14.8802 21 13.2V7.8C21 6.11984 21 5.27976 20.673 4.63803C20.3854 4.07354 19.9265 3.6146 19.362 3.32698C18.7202 3 17.8802 3 16.2 3H7.8C6.11984 3 5.27976 3 4.63803 3.32698C4.07354 3.6146 3.6146 4.07354 3.32698 4.63803C3 5.27976 3 6.11984 3 7.8V14C3 14.93 3 15.395 3.10222 15.7765C3.37962 16.8117 4.18827 17.6204 5.22354 17.8978C5.60504 18 6.07003 18 7 18Z"/>
            </svg>
          </button>
        </div>
        <!-- One scroll region so quick-action chips sit right under the latest message. -->
        <div class="assistant__content" id="assistantContent">
          <div class="assistant__messages" id="assistantMessages" role="log" aria-live="polite">
            <p class="assistant__hint" id="assistantHint">Ask the AI Assistant to help draft, summarize, or answer questions about this thread.</p>
          </div>
          <div class="assistant__quick-result" id="assistantQuickResult" hidden></div>
          <div class="assistant__chips" id="assistantChips" hidden></div>
        </div>
        <div class="assistant__composer">
          <textarea class="assistant__input" id="assistantInput" rows="1" placeholder="Ask me anything..." aria-label="Message the AI Assistant"></textarea>
          <div class="assistant__composer-footer">
            <button type="button" class="assistant__send" id="assistantSendBtn" aria-label="Send" title="Send" disabled>
              <svg width="18" height="16" viewBox="0 0 18 16" fill="currentColor" aria-hidden="true">
                <path d="M1.18333 0.0143778C1.51468 -0.0349085 1.79953 0.0546397 1.93669 0.100755C2.11893 0.162062 2.33475 0.257749 2.5378 0.346449L16.6411 6.50705L16.9417 6.64046C17.0405 6.68563 17.1354 6.73137 17.2185 6.77674C17.3449 6.84582 17.5985 6.99099 17.7791 7.26045L17.8512 7.3833L17.9165 7.53206C18.0279 7.83469 18.0278 8.16612 17.9165 8.46877L17.8512 8.61753C17.6732 8.96668 17.3629 9.14614 17.2185 9.22505C17.1355 9.27037 17.0404 9.31622 16.9417 9.36133L16.6411 9.49474L2.54274 15.6534C2.33896 15.7424 2.12222 15.8377 1.93966 15.8991C1.80237 15.9453 1.51717 16.0351 1.18531 15.9855L1.04096 15.9548C0.660986 15.8517 0.343208 15.6025 0.160059 15.2686L0.0898641 15.1198C-0.0579491 14.7517 0.0198033 14.4032 0.0582268 14.2464C0.102964 14.064 0.179095 13.8456 0.250028 13.6399L1.5967 9.72967C1.63195 9.62732 1.64958 9.57615 1.68072 9.53536C1.70827 9.49928 1.74336 9.46924 1.78368 9.44721C1.82926 9.42232 1.88376 9.41174 1.99277 9.39058L7.54342 8.31329C7.89608 8.24482 7.89608 7.75601 7.54342 7.68754L1.97567 6.60565C1.86642 6.58442 1.81179 6.57381 1.76615 6.54883C1.72577 6.52672 1.69065 6.49658 1.6631 6.46038C1.63197 6.41947 1.61443 6.36814 1.57934 6.26549L0.243107 2.35616C0.172955 2.15098 0.0975036 1.93285 0.0532834 1.75056C0.015348 1.59404 -0.0602514 1.2456 0.0878867 0.878148L0.158082 0.729388C0.341575 0.396205 0.659451 0.147743 1.03898 0.0450896L1.18333 0.0143778Z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </aside>

    </div><!-- /#mailSplit -->

  </div>

  <script type="module" src="/app.bundle.js"></script>
  <!-- Dev live reload: the endpoint only exists under `npm run dev`. -->
  <script>
    (function () {
      if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || !window.EventSource) return;
      var source = new EventSource('/__livereload');
      source.onmessage = function (event) {
        if (event.data !== 'css') return location.reload();
        document.querySelectorAll('link[rel="stylesheet"]').forEach(function (link) {
          var url = new URL(link.href);
          if (url.origin !== location.origin) return;
          url.searchParams.set('v', Date.now());
          link.href = url.toString();
        });
      };
      // No endpoint (not `npm run dev`): stop retrying.
      source.onerror = function () { if (source.readyState === EventSource.CLOSED) source.close(); };
    })();
  </script>
</body>
</html>
