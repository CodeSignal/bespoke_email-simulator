<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CosmoMail</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Design System: Foundations -->
  <link rel="stylesheet" href="/design-system/colors/colors.css" />
  <link rel="stylesheet" href="/design-system/spacing/spacing.css" />
  <link rel="stylesheet" href="/design-system/typography/typography.css" />

  <!-- Design System: Components -->
  <link rel="stylesheet" href="/design-system/components/button/button.css" />
  <link rel="stylesheet" href="/design-system/components/boxes/boxes.css" />
  <link rel="stylesheet" href="/design-system/components/icons/icons.css" />
  <link rel="stylesheet" href="/design-system/components/input/input.css" />
  <link rel="stylesheet" href="/design-system/components/tags/tags.css" />
  <link rel="stylesheet" href="/design-system/components/dropdown/dropdown.css" />
  <link rel="stylesheet" href="/design-system/components/modal/modal.css" />

  <link rel="stylesheet" href="/app.css" />
</head>
<body>

  <div class="boot-error body-small" id="bootError" role="alert" hidden></div>

  <div class="mail-app" id="mailApp">

    <!-- ── MAILBOX RAIL (folders only) ── -->
    <aside class="rail" id="threadRail" aria-label="Mailbox">
      <div class="rail__header">
        <span class="cmail-brand">
          <span class="icon icon-cosmo-black icon-primary cmail-brand__icon" aria-hidden="true"></span>
          <span class="heading-xxxsmall cmail-brand__name" id="appTitle">CosmoMail</span>
        </span>
      </div>
      <div class="rail__compose">
        <button type="button" class="button button-primary rail__compose-btn" id="composeBtn">
          <svg class="rail__compose-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M2 12.5V14h1.5L12 5.5 10.5 4 2 12.5Z"/>
            <path d="M9.5 3 13 6.5"/>
          </svg>
          <span id="composeBtnLabel">Compose</span>
        </button>
      </div>
      <nav class="rail__mailboxes" id="mailboxList" aria-label="Folders"></nav>
    </aside>

    <!-- ── MAIN: list, or a conversation / compose that takes it over ── -->
    <main class="mail-main" id="mailMain">
      <header class="mail-toolbar" id="mailToolbar">
        <button type="button" class="button button-text button-small mail-toolbar__back" id="backBtn" hidden aria-label="Back to mail list">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M10 3 5 8l5 5"/>
          </svg>
        </button>
        <h1 class="heading-xxxsmall mail-toolbar__title" id="mailToolbarTitle">Inbox</h1>
      </header>

      <section class="mail-list" id="mailList" aria-label="Mail">
        <div class="mail-list__rows" id="threadList"></div>
      </section>

      <section class="reading-pane" id="readingPane" aria-label="Conversation" aria-live="polite" hidden></section>

      <section class="composer" id="composer" aria-label="Compose" hidden>
        <div class="composer__fields">
          <div class="composer__field">
            <span class="label-small composer__label" id="composeToLabel">To</span>
            <div class="recipient-picker" id="composeToPicker" data-field="to" role="group" aria-labelledby="composeToLabel">
              <div class="recipient-picker__chips" id="composeToChips"></div>
              <button type="button" class="recipient-picker__add body-small" id="composeToAdd" aria-haspopup="listbox" aria-expanded="false" aria-controls="composeToMenu">Select a recipient</button>
              <ul class="recipient-picker__menu" id="composeToMenu" role="listbox" hidden></ul>
            </div>
          </div>
          <div class="composer__field">
            <span class="label-small composer__label" id="composeCcLabel">Cc</span>
            <div class="recipient-picker" id="composeCcPicker" data-field="cc" role="group" aria-labelledby="composeCcLabel">
              <div class="recipient-picker__chips" id="composeCcChips"></div>
              <button type="button" class="recipient-picker__add body-small" id="composeCcAdd" aria-haspopup="listbox" aria-expanded="false" aria-controls="composeCcMenu">Select a recipient</button>
              <ul class="recipient-picker__menu" id="composeCcMenu" role="listbox" hidden></ul>
            </div>
          </div>
          <label class="composer__field">
            <span class="label-small composer__label">Subject</span>
            <input type="text" class="input composer__input" id="composeSubject" placeholder="Subject" />
          </label>
        </div>
        <div class="composer__body" id="composerBody">
          <!-- TipTap editor mounts here (Stage 4) -->
          <div class="composer__placeholder body-small" id="composerPlaceholder">Message editor loads here.</div>
        </div>
        <div class="composer__attachments" id="attachmentPreview" hidden></div>
        <input type="file" id="fileInput" multiple hidden />
        <div class="composer__toolbar">
          <div class="composer__toolbar-start">
            <button type="button" class="button button-text button-small composer__attach" id="attachBtn" hidden>Attach</button>
            <button type="button" class="button button-text button-small" id="discardBtn" hidden>Discard</button>
          </div>
          <button type="button" class="button button-primary button-small" id="sendBtn" disabled>Send</button>
        </div>
      </section>
    </main>

    <!-- ── ASSISTANT PANEL ── -->
    <aside class="assistant" id="assistantPanel" aria-label="AI assistant">
      <div class="assistant__header">
        <span class="icon icon-cosmo-black icon-primary icon-small" aria-hidden="true"></span>
        <span class="heading-xxxsmall assistant__title">Cosmo</span>
      </div>
      <div class="assistant__messages" id="assistantMessages" role="log" aria-live="polite">
        <p class="body-xsmall assistant__hint" id="assistantHint">Ask Cosmo to help draft, summarize, or answer questions about this thread.</p>
      </div>
      <div class="assistant__composer">
        <textarea class="input assistant__input" id="assistantInput" rows="2" placeholder="Ask Cosmo..." aria-label="Message Cosmo"></textarea>
        <button type="button" class="button button-secondary button-small" id="assistantSendBtn" disabled>Send</button>
      </div>
    </aside>

  </div>

  <script type="module" src="/app.bundle.js"></script>
</body>
</html>
